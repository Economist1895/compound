<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compound — wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <h1>Compound</h1>
        <span class="tag">See where your money is headed.</span>
      </div>
      <span class="wf-flag">Wireframe · placeholder data</span>
    </header>

    <main id="app"><!-- layout injected here --></main>

    <p class="foot-note">Numbers are illustrative — the real projection engine is wired in at the coding stage.</p>
  </div>

  <!-- tweaks island -->
  <div id="tweaks-root"></div>

  <!-- neutralise benign ResizeObserver loop notification at the source -->
  <script>
    window.addEventListener('error', function (e) {
      if (e && e.message && e.message.indexOf('ResizeObserver loop') !== -1) {
        e.stopImmediatePropagation();
        e.preventDefault();
        return false;
      }
    }, true);
    (function () {
      var RO = window.ResizeObserver;
      if (!RO) return;
      window.ResizeObserver = function (cb) {
        return new RO(function (entries, obs) {
          window.requestAnimationFrame(function () { cb(entries, obs); });
        });
      };
    })();
    (function () {
      var ce = console.error;
      console.error = function () {
        var first = arguments[0];
        if (typeof first === 'string' && first.indexOf('ResizeObserver loop') !== -1) return;
        return ce.apply(console, arguments);
      };
    })();
  </script>

  <!-- engine + chart + app (vanilla) -->
  <script src="js/engine.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>

  <!-- React tweaks panel (island, bridges into vanilla app) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "sketchiness": "Clean lines",
      "accent": "#5b8f6e",
      "density": "Compact",
      "paper": "Light",
      "showSalary": true
    }/*EDITMODE-END*/;

    function TweaksApp() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      React.useEffect(() => {
        if (window.applyTweaks) window.applyTweaks(t);
      }, [t]);
      return (
        <TweaksPanel title="Tweaks">
          <TweakSection label="Look" />
          <TweakRadio label="Style" value={t.sketchiness}
            options={['Hand-drawn', 'Clean lines']}
            onChange={(v) => setTweak('sketchiness', v)} />
          <TweakColor label="Accent" value={t.accent}
            options={['#5b7fb5', '#5b8f6e', '#8a6ea0', '#b5775b']}
            onChange={(v) => setTweak('accent', v)} />
          <TweakRadio label="Paper" value={t.paper}
            options={['Light', 'Dark']}
            onChange={(v) => setTweak('paper', v)} />
          <TweakSection label="Layout" />
          <TweakRadio label="Density" value={t.density}
            options={['Comfortable', 'Compact']}
            onChange={(v) => setTweak('density', v)} />
        </TweaksPanel>
      );
    }

    ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<TweaksApp />);
  </script>
</body>
</html>
